# Enable proxy modules
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so

# Serve a static SPARQL Service Description for a bare GET of /sparql
# (no query string, Accept asking for RDF/SD) — e.g. YummyData's Operation check.
# Must come before ProxyPass /sparql so it intercepts first.
RewriteEngine On
RewriteCond %{QUERY_STRING} ^$
RewriteCond %{HTTP:Accept} (turtle|rdf\+xml|sparql-service-desc) [NC]
RewriteRule ^/sparql$ /sd.ttl [L]

<Files "sd.ttl">
    ForceType text/turtle
</Files>

# Linked Data: make PlantMetWiki resource IRIs dereferenceable, e.g.
#   http://rdf-plantmetwiki.bioinformatics.nl/pathways/PC1003_r20251217115329
# RDF clients get a SPARQL DESCRIBE from Virtuoso in the format they ask for
# (content negotiation, checked by YummyData's Turtle/RDF-XML tests); anything
# else (browsers) gets a 303 to the explorer with the DESCRIBE query filled in.
# The IRI is always rebuilt on the canonical http://rdf-plantmetwiki... base,
# whichever host name the request came in on.
# \% is a literal % (a bare %N would be a RewriteCond backreference); B
# percent-encodes the captured path so it is safe inside the query string.
RewriteCond %{HTTP:Accept} (text/turtle|application/x-turtle) [NC]
RewriteRule ^/((?:pathways|Pathway|id|dataset|license|organization|graph|vocab)/.+)$ http://virtuoso:8890/sparql?query=DESCRIBE\%20\%3Chttp\%3A\%2F\%2Frdf-plantmetwiki.bioinformatics.nl\%2F$1\%3E&format=text\%2Fturtle [B,NE,P,L]

RewriteCond %{HTTP:Accept} application/rdf\+xml [NC]
RewriteRule ^/((?:pathways|Pathway|id|dataset|license|organization|graph|vocab)/.+)$ http://virtuoso:8890/sparql?query=DESCRIBE\%20\%3Chttp\%3A\%2F\%2Frdf-plantmetwiki.bioinformatics.nl\%2F$1\%3E&format=application\%2Frdf\%2Bxml [B,NE,P,L]

RewriteCond %{HTTP:Accept} application/n-triples [NC]
RewriteRule ^/((?:pathways|Pathway|id|dataset|license|organization|graph|vocab)/.+)$ http://virtuoso:8890/sparql?query=DESCRIBE\%20\%3Chttp\%3A\%2F\%2Frdf-plantmetwiki.bioinformatics.nl\%2F$1\%3E&format=application\%2Fn-triples [B,NE,P,L]

RewriteRule ^/((?:pathways|Pathway|id|dataset|license|organization|graph|vocab)/.+)$ /?q=DESCRIBE\%20\%3Chttp\%3A\%2F\%2Frdf-plantmetwiki.bioinformatics.nl\%2F$1\%3E [B,NE,R=303,L]

# CORS wildcard (read-only public SPARQL endpoint)
# unset first: Virtuoso already reflects its own Access-Control-Allow-Origin,
# and without this we'd end up with two ACAO values on one response, which
# browsers treat as an invalid CORS response.
Header unset Access-Control-Allow-Origin
Header always set Access-Control-Allow-Origin "*"

# Proxy /sparql requests to Virtuoso container
# 'virtuoso' is the Docker service name from docker-compose.yml
ProxyPass /sparql http://virtuoso:8890/sparql
ProxyPassReverse /sparql http://virtuoso:8890/sparql
 
# Optional: Also proxy /sparql-auth if needed
# ProxyPass /sparql-auth http://virtuoso:8890/sparql-auth
# ProxyPassReverse /sparql-auth http://virtuoso:8890/sparql-auth

# Proxy /conductor (Virtuoso admin interface)
ProxyPass /conductor http://virtuoso:8890/conductor
ProxyPassReverse /conductor http://virtuoso:8890/conductor

# Serve the merged VoID description at the well-known URI (RFC 8615).
# The file itself is published into htdocs/.well-known/void by
# scripts/load-plantmetwiki-data.sh after each data load.
# <Location>, not <Files>: <Files> only matches the base name ("void"), so a
# path like ".well-known/void" never matched and the file was not served as
# Turtle.
<Location "/.well-known/void">
    ForceType text/turtle
</Location>